<div class="page-wrapper">
  <div class="reset-card">
    <div class="lock-circle">
      <svg viewBox="0 0 24 24" class="lock-icon">
        <path fill="#1a73e8" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/>
      </svg>
    </div>

    <h2 class="title">Reset Password</h2>
    <p class="subtitle">Please enter your new password below.</p>

    <form (ngSubmit)="onSubmit()" #resetForm="ngForm">
      <div class="input-group">
        <input
          type="password"
          name="newPassword"
          placeholder="New Password*"
          [(ngModel)]="newPassword"
          required
          class="text-input"
          [class.error-input]="newPasswordError"
          (input)="validatePassword()"
          [disabled]="isLoading"
        />
      </div>
      <p class="field-error" style="margin-top: -12px; margin-bottom: 16px; text-align: left;" *ngIf="newPasswordError">{{ newPasswordError }}</p>

      <div class="input-group">
        <input
          type="password"
          name="confirmPassword"
          placeholder="Confirm Password*"
          [(ngModel)]="confirmPassword"
          required
          class="text-input"
          [class.error-input]="confirmPasswordError"
          (input)="validateConfirmPassword()"
          [disabled]="isLoading"
        />
      </div>
      <p class="field-error" style="margin-top: -12px; margin-bottom: 16px; text-align: left;" *ngIf="confirmPasswordError">{{ confirmPasswordError }}</p>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <button type="submit" class="btn-block btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Reset Password</span>
        <span *ngIf="isLoading" class="btn-loader-container">
          <span class="btn-spinner"></span>
          Resetting...
        </span>
      </button>

      <div class="cold-start-notice" *ngIf="isLoading && showColdStartNotice">
        <span class="notice-icon">⏱️</span>
        Starting server, this may take 1-2 minutes...
      </div>

      <button type="button" class="btn-block btn-primary" (click)="goToLogin()" [disabled]="isLoading">Back to Login</button>
    </form>
  </div>
</div>
