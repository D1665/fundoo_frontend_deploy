<div class="page-wrapper">
  <div class="forgot-card">
    <div class="lock-circle">
      <svg viewBox="0 0 24 24" class="lock-icon">
        <path fill="#1a73e8" d="M12 1a5 5 0 0 0-5 5v3H6a2 2 0 0 0-2 2v9a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2v-9a2 2 0 0 0-2-2h-1V6a5 5 0 0 0-5-5zm0 2a3 3 0 0 1 3 3v3H9V6a3 3 0 0 1 3-3z"/>
      </svg>
    </div>

    <h2 class="title">Forgot Password?</h2>
    <p class="subtitle">Enter your email address and we'll send you a link to reset your password.</p>

    <form (ngSubmit)="onSendResetLink()" #forgotForm="ngForm">
      <div class="input-group">
        <input
          type="email"
          name="email"
          placeholder="Email*"
          [(ngModel)]="email"
          required
          class="text-input"
          
          (input)="validateEmail()"
          [class.error-input]="emailError"
          [disabled]="isLoading"
        />
        <span class="email-icon">&#9993;</span>
      </div>
      <p class="field-error" style="margin-top: -12px; margin-bottom: 16px;" *ngIf="emailError">{{ emailError }}</p>

      <p class="error" *ngIf="errorMessage">{{ errorMessage }}</p>
      <p class="success" *ngIf="successMessage">{{ successMessage }}</p>

      <button type="submit" class="btn-block btn-primary" [disabled]="isLoading">
        <span *ngIf="!isLoading">Send Reset Link</span>
        <span *ngIf="isLoading" class="btn-loader-container">
          <span class="btn-spinner"></span>
          Sending...
        </span>
      </button>

      <div class="cold-start-notice" *ngIf="isLoading && showColdStartNotice">
        <span class="notice-icon">⏱️</span>
        Starting the server... This may take a few moments
      </div>

      <button type="button" class="btn-block btn-primary" (click)="goToLogin()" [disabled]="isLoading">Back to Login</button>
    </form>
  </div>
</div>
