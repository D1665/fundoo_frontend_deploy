<header class="navbar">

    <!-- Left Section -->
    <div class="navbar-left">
  
      <button mat-icon-button (click)="onMenuClick()">
        <mat-icon>menu</mat-icon>
      </button>
  
      <img
        src="assets/google-keep.png"
        alt="Fundoo Logo"
        class="logo-image"
        (click)="onLogoClick()"
        style="cursor: pointer;"
        title="Fundoo Keep"
      />
  
      <span class="logo-text" (click)="onLogoClick()" style="cursor: pointer;" title="Fundoo Keep">
        Fundoo
      </span>
  
    </div>
  
  
    <!-- Center Section -->
  
    <div class="search-container">
  
      <mat-icon class="search-icon">
        search
      </mat-icon>
  
      <input
        type="text"
        placeholder="Search"
        [(ngModel)]="searchQuery"
        (ngModelChange)="onSearchChange($event)"
      />
  
    </div>
  
  
    <!-- Right Section -->
  
    <div class="navbar-right">
  
      <button mat-icon-button (click)="onRefresh()" title="Refresh" [disabled]="isRefreshing">
        <mat-icon [class.spinning]="isRefreshing">refresh</mat-icon>
      </button>
  
      <button mat-icon-button (click)="toggleView()" title="Toggle view" class="hide-mobile">
        <mat-icon>{{ isGridView ? 'view_agenda' : 'grid_view' }}</mat-icon>
      </button>
  
      <button mat-icon-button class="hide-mobile">
        <mat-icon>settings</mat-icon>
      </button>
  
      <button mat-icon-button class="hide-mobile">
        <mat-icon>apps</mat-icon>
      </button>
  
      <div class="avatar-container">
        <button
          mat-icon-button
          (click)="toggleProfileMenu($event)">
          <div class="avatar">
            {{ avatarInitial }}
          </div>
        </button>
        
        <!-- Custom Dropdown Overlay (Pure HTML/CSS/Angular) -->
        <div *ngIf="isProfileMenuOpen" class="profile-card-dropdown">
          <div class="profile-card">
            <div class="profile-card-header">
              <div class="profile-card-avatar">
                {{ avatarInitial }}
              </div>
              <h3 class="profile-card-greeting">Hi, {{ userName }}!</h3>
              <div class="profile-card-email-pill">
                {{ userEmail }}
              </div>
            </div>
            
            <div class="profile-card-divider"></div>
            
            <div class="profile-card-body">
              <div class="profile-card-actions">
                <button class="profile-card-btn" (click)="addAccount()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M16 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"></path>
                    <circle cx="8.5" cy="7" r="4"></circle>
                    <line x1="20" y1="8" x2="20" y2="14"></line>
                    <line x1="23" y1="11" x2="17" y2="11"></line>
                  </svg>
                  <span>Add account</span>
                </button>
                <button class="profile-card-btn" (click)="signOut()">
                  <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                  </svg>
                  <span>Sign out</span>
                </button>
              </div>
              
              <div class="profile-card-footer">
                <a href="#" class="footer-link">Privacy Policy</a>
                <span class="footer-separator">•</span>
                <a href="#" class="footer-link">Terms of Service</a>
              </div>
            </div>
          </div>
        </div>
      </div>
  
    </div>
  
  </header>
